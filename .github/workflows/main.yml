name: Kernel Autobuild

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      KERNEL_GIT_URL: https://github.com/LineageOS/android_kernel_oneplus_sm8250.git
      KERNEL_BRANCH: lineage-21
      KERNEL_DIR: ${{ github.workspace }}/kernel
      DEFCONFIG: vendor/kona_defconfig
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      OUT_DIR: ${{ github.workspace }}/out
      JOBS: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reset Git auth state
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --unset-all credential.helper || true
          git config --global --unset-all url."https://github.com/".insteadOf || true
          git config --global --unset-all url."git@github.com:".insteadOf || true
          git config --global --add safe.directory '*'
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential git wget curl ca-certificates bc bison flex \
            python3 python3-pip zip unzip ccache ncurses-dev \
            libssl-dev libelf-dev clang lld gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu

      - name: Verify kernel repo is reachable
        shell: bash
        run: |
          set -euxo pipefail
          GIT_TERMINAL_PROMPT=0 git ls-remote --heads "$KERNEL_GIT_URL" | head

      - name: Fetch kernel source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$KERNEL_DIR"
          GIT_TERMINAL_PROMPT=0 git clone --depth 1 --branch "$KERNEL_BRANCH" "$KERNEL_GIT_URL" "$KERNEL_DIR"

      - name: Build kernel
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$OUT_DIR"
          export ARCH CROSS_COMPILE
          make -C "$KERNEL_DIR" O="$OUT_DIR" "$DEFCONFIG"
          make -C "$KERNEL_DIR" O="$OUT_DIR" -j"$JOBS"

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-artifacts
          path: |
            ${{ github.workspace }}/out/**
          if-no-files-found: warn
